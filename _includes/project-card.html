{%- comment -%} One project card. Pass p (a page from collections.projects) and heading ("h2" or "h3"). {%- endcomment -%}
<li class="project-card"><a href="{{ p.url }}"><span class="project-card__media"><img src="{{ p | projectThumb }}" alt="" loading="lazy" width="768" height="432"></span><span class="project-card__body"><{{ heading }}>{{ p.data.project.name }}</{{ heading }}><p>{{ p.data.project.summary }}</p></span></a></li>
